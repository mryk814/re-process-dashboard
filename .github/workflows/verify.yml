name: Full verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: full gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERIFY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.20.0
          cache: npm

      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.9.15
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Pin npm
        run: npm install --global npm@11.4.2

      - name: Install locked dependencies
        run: |
          npm ci
          uv sync --frozen --extra dev

      - name: Install browser for failure-state E2E
        run: npx playwright install --with-deps chrome

      - name: Run full verification
        run: npm run verify:full
