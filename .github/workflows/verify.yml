name: PR verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verification-plan:
    name: verification plan
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      VERIFY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    outputs:
      commit_sha: ${{ steps.plan.outputs.commit_sha }}
      catalog_sha256: ${{ steps.plan.outputs.catalog_sha256 }}
      plan_digest: ${{ steps.plan.outputs.plan_digest }}
      execution_mode: ${{ steps.plan.outputs.execution_mode }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.20.0

      - name: Build immutable verification plan
        id: plan
        run: node scripts/verification-ci.mjs plan --output artifacts/verification/ci-plan.json --github-output $env:GITHUB_OUTPUT

      - name: Upload verification plan
        uses: actions/upload-artifact@v6
        with:
          name: verification-plan
          path: artifacts/verification/ci-plan.json
          if-no-files-found: error

      - name: Find same-base reusable evidence runs
        if: steps.plan.outputs.execution_mode != 'lightweight-direct'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verification-ci.mjs find-reusable-runs --output artifacts/verification/reusable-runs.json

      - name: Upload reusable evidence candidates
        if: steps.plan.outputs.execution_mode != 'lightweight-direct'
        uses: actions/upload-artifact@v6
        with:
          name: verification-reusable-runs
          path: artifacts/verification/reusable-runs.json
          if-no-files-found: error

  verification-evidence-reuse:
    name: verification evidence reuse
    needs: verification-plan
    if: needs.verification-plan.outputs.execution_mode != 'lightweight-direct'
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.reuse.outputs.matrix }}
      executed_shards: ${{ steps.reuse.outputs.executed_shards }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ needs.verification-plan.outputs.commit_sha }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.20.0

      - name: Download immutable verification plan
        uses: actions/download-artifact@v7
        with:
          name: verification-plan
          path: artifacts/verification

      - name: Download reusable evidence candidates
        uses: actions/download-artifact@v7
        with:
          name: verification-reusable-runs
          path: artifacts/verification

      - name: Download direct shard evidence from candidate runs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content -Raw artifacts/verification/reusable-runs.json | ConvertFrom-Json
          $plan = Get-Content -Raw artifacts/verification/ci-plan.json | ConvertFrom-Json
          $artifactNames = @("direct-verification-report") + @(
            $plan.shards | ForEach-Object { "verification-shard-$($_.id)" }
          )
          $evaluatedRuns = @()
          foreach ($candidate in $manifest.runs) {
            $runRoot = "artifacts/verification/reuse-candidates/$($candidate.runId)"
            New-Item -ItemType Directory -Force $runRoot | Out-Null
            $downloadArgs = @(
              "run", "download", $candidate.runId,
              "--repo", $env:GITHUB_REPOSITORY,
              "--dir", $runRoot
            )
            foreach ($artifactName in $artifactNames) {
              $downloadArgs += @("--name", $artifactName)
            }
            gh @downloadArgs
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Run $($candidate.runId) has no downloadable direct shard evidence."
              continue
            }
            $evaluatedRuns += $candidate
            [ordered]@{
              schemaVersion = $manifest.schemaVersion
              runs = $evaluatedRuns
            } | ConvertTo-Json -Depth 20 | Set-Content -Encoding utf8 artifacts/verification/evaluated-runs.json
            node scripts/verification-ci.mjs reuse --plan artifacts/verification/ci-plan.json --source-runs artifacts/verification/evaluated-runs.json --source-evidence artifacts/verification/reuse-candidates --output artifacts/verification/reuse-probe/reuse.json
            if ($LASTEXITCODE -ne 0) {
              throw "Reusable evidence probe failed for run $($candidate.runId)."
            }
            $probe = Get-Content -Raw artifacts/verification/reuse-probe/reuse.json | ConvertFrom-Json
            if ($probe.executedShardIds.Count -eq 0) {
              Write-Host "Direct green evidence is complete after run $($candidate.runId)."
              break
            }
          }
          exit 0

      - name: Select executed and reused shards
        id: reuse
        run: node scripts/verification-ci.mjs reuse --plan artifacts/verification/ci-plan.json --source-runs artifacts/verification/reusable-runs.json --source-evidence artifacts/verification/reuse-candidates --output artifacts/verification/reuse/reuse.json --github-output $env:GITHUB_OUTPUT

      - name: Upload reused shard reports
        uses: actions/upload-artifact@v6
        with:
          name: verification-evidence-reuse
          path: artifacts/verification/reuse
          if-no-files-found: error

  verification-shards:
    name: verification shard (${{ matrix.shard.id }})
    needs: [verification-plan, verification-evidence-reuse]
    if: needs.verification-plan.outputs.execution_mode != 'lightweight-direct' && needs.verification-evidence-reuse.outputs.executed_shards != ''
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verification-evidence-reuse.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ needs.verification-plan.outputs.commit_sha }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.20.0
          cache: npm

      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.9.15
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Pin npm
        run: npm install --global npm@11.4.2

      - name: Install locked dependencies
        run: |
          npm ci
          uv sync --frozen --extra dev

      - name: Download immutable verification plan
        uses: actions/download-artifact@v7
        with:
          name: verification-plan
          path: artifacts/verification

      - name: Run verification shard
        env:
          PLAYWRIGHT_E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard.id }}
          PLAYWRIGHT_CI_DIAGNOSTICS: "1"
          PLAYWRIGHT_OUTPUT_DIR: artifacts/playwright/${{ matrix.shard.id }}/test-results
          PLAYWRIGHT_HTML_OUTPUT_DIR: artifacts/playwright/${{ matrix.shard.id }}/html
          PLAYWRIGHT_BLOB_OUTPUT_DIR: artifacts/playwright/${{ matrix.shard.id }}/blob
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: artifacts/playwright/${{ matrix.shard.id }}/junit.xml
        run: node scripts/run-observed-ci-shard.mjs --plan artifacts/verification/ci-plan.json --shard ${{ matrix.shard.id }} --output artifacts/verification/shards/${{ matrix.shard.id }}.json

      - name: Upload shard diagnostics and Playwright reports
        id: upload-diagnostics
        if: failure() || cancelled()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: verification-shard-diagnostics-${{ matrix.shard.id }}
          path: |
            artifacts/verification/diagnostics/${{ matrix.shard.id }}
            artifacts/playwright/${{ matrix.shard.id }}
          if-no-files-found: warn
          retention-days: 7

      - name: Record diagnostics artifact upload outcome
        if: always()
        shell: pwsh
        env:
          DIAGNOSTICS_UPLOAD_OUTCOME: ${{ steps.upload-diagnostics.outcome }}
        run: |
          $reportPath = "artifacts/verification/shards/${{ matrix.shard.id }}.json"
          if (Test-Path $reportPath) {
            $report = Get-Content -Raw $reportPath | ConvertFrom-Json
            $outcome = if ($env:DIAGNOSTICS_UPLOAD_OUTCOME) { $env:DIAGNOSTICS_UPLOAD_OUTCOME } else { "skipped" }
            $report.diagnostics | Add-Member -NotePropertyName upload -NotePropertyValue ([ordered]@{
              required = $report.status -ne "passed"
              attempted = $outcome -ne "skipped"
              outcome = $outcome
            }) -Force
            [IO.File]::WriteAllText(
              (Resolve-Path $reportPath),
              (($report | ConvertTo-Json -Depth 100) + "`n"),
              [Text.UTF8Encoding]::new($false)
            )
          }

      - name: Publish shard diagnostics summary
        if: failure() || cancelled()
        shell: pwsh
        run: |
          $reportPath = "artifacts/verification/shards/${{ matrix.shard.id }}.json"
          if (Test-Path $reportPath) {
            $report = Get-Content -Raw $reportPath | ConvertFrom-Json
            @(
              "## $($report.shardId) diagnostics"
              ""
              "- tested merge SHA: ``$($report.testedCommit)``"
              "- PR head SHA: ``$($report.diagnostics.identity.pullRequestHeadSha)``"
              "- run/shard: $($report.diagnostics.identity.github.runId) / $($report.diagnostics.identity.github.runAttempt) / $($report.shardId)"
              "- Playwright run/workers/retries: $($report.diagnostics.identity.playwright.e2eRunId) / $($report.diagnostics.identity.playwright.workers) / $($report.diagnostics.identity.playwright.retries)"
              "- ports: api=$($report.diagnostics.identity.playwright.ports.api), web=$($report.diagnostics.identity.playwright.ports.web)"
              "- workspace isolation: $($report.diagnostics.identity.playwright.workspace.kind)"
              "- workspace report: ``$($report.diagnostics.identity.playwright.workspace.reportPath)``"
              "- single-process workspace DB: ``$($report.diagnostics.identity.playwright.workspace.database)``"
            ) | Add-Content $env:GITHUB_STEP_SUMMARY
            foreach ($gate in @($report.diagnostics.failedGates)) {
              @("", "### failed gate: $($gate.id)", "", '```text', $gate.failureExcerpt, '```') |
                Add-Content $env:GITHUB_STEP_SUMMARY
            }
          } else {
            "## ${{ matrix.shard.id }} diagnostics`n`nShard report was not written; inspect the uploaded runner diagnostics." |
              Add-Content $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload verification shard report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: verification-shard-${{ matrix.shard.id }}
          path: artifacts/verification/shards/${{ matrix.shard.id }}.json
          if-no-files-found: error

  direct-verification:
    name: direct verification
    needs: [verification-plan, verification-evidence-reuse, verification-shards]
    if: always()
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ needs.verification-plan.outputs.commit_sha }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.20.0

      - uses: astral-sh/setup-uv@v6
        if: needs.verification-plan.outputs.execution_mode == 'lightweight-direct'
        with:
          version: 0.9.15
          enable-cache: false

      - name: Download immutable verification plan
        uses: actions/download-artifact@v7
        with:
          name: verification-plan
          path: artifacts/verification
        continue-on-error: true

      - name: Download verification shard reports
        if: needs.verification-plan.outputs.execution_mode != 'lightweight-direct'
        uses: actions/download-artifact@v7
        with:
          pattern: verification-shard-*
          path: artifacts/verification/shards
          merge-multiple: true
        continue-on-error: true

      - name: Download reusable shard reports
        if: needs.verification-plan.outputs.execution_mode != 'lightweight-direct'
        uses: actions/download-artifact@v7
        with:
          name: verification-evidence-reuse
          path: artifacts/verification/reuse
        continue-on-error: true

      - name: Include reusable shard reports
        if: needs.verification-plan.outputs.execution_mode != 'lightweight-direct'
        shell: pwsh
        run: |
          $source = "artifacts/verification/reuse/reused-shards"
          if (Test-Path $source) {
            Copy-Item "$source/*" "artifacts/verification/shards" -Force
          }

      - name: Run lightweight direct verification
        id: lightweight-direct
        if: needs.verification-plan.outputs.execution_mode == 'lightweight-direct'
        env:
          PLAYWRIGHT_E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-contract-build
          PLAYWRIGHT_CI_DIAGNOSTICS: "1"
        run: node scripts/verification-ci.mjs run-shard --plan artifacts/verification/ci-plan.json --shard contract-build --output artifacts/verification/shards/contract-build.json

      - name: Upload lightweight direct diagnostics
        id: upload-lightweight-diagnostics
        if: always() && needs.verification-plan.outputs.execution_mode == 'lightweight-direct' && (failure() || cancelled())
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: verification-shard-diagnostics-contract-build
          path: artifacts/verification/diagnostics/contract-build
          if-no-files-found: warn
          retention-days: 7

      - name: Record lightweight diagnostics artifact upload outcome
        if: always() && needs.verification-plan.outputs.execution_mode == 'lightweight-direct'
        shell: pwsh
        env:
          DIAGNOSTICS_UPLOAD_OUTCOME: ${{ steps.upload-lightweight-diagnostics.outcome }}
        run: |
          $reportPath = "artifacts/verification/shards/contract-build.json"
          if (Test-Path $reportPath) {
            $report = Get-Content -Raw $reportPath | ConvertFrom-Json
            $outcome = if ($env:DIAGNOSTICS_UPLOAD_OUTCOME) { $env:DIAGNOSTICS_UPLOAD_OUTCOME } else { "skipped" }
            $report.diagnostics | Add-Member -NotePropertyName upload -NotePropertyValue ([ordered]@{
              required = $report.status -ne "passed"
              attempted = $outcome -ne "skipped"
              outcome = $outcome
            }) -Force
            [IO.File]::WriteAllText(
              (Resolve-Path $reportPath),
              (($report | ConvertTo-Json -Depth 100) + "`n"),
              [Text.UTF8Encoding]::new($false)
            )
          }

      - name: Publish lightweight direct diagnostics summary
        if: always() && needs.verification-plan.outputs.execution_mode == 'lightweight-direct' && (failure() || cancelled())
        shell: pwsh
        run: |
          $reportPath = "artifacts/verification/shards/contract-build.json"
          if (Test-Path $reportPath) {
            $report = Get-Content -Raw $reportPath | ConvertFrom-Json
            @(
              "## $($report.shardId) diagnostics"
              ""
              "- tested merge SHA: ``$($report.testedCommit)``"
              "- PR head SHA: ``$($report.diagnostics.identity.pullRequestHeadSha)``"
              "- run/shard: $($report.diagnostics.identity.github.runId) / $($report.diagnostics.identity.github.runAttempt) / $($report.shardId)"
            ) | Add-Content $env:GITHUB_STEP_SUMMARY
            foreach ($gate in @($report.diagnostics.failedGates)) {
              @("", "### failed gate: $($gate.id)", "", '```text', $gate.failureExcerpt, '```') |
                Add-Content $env:GITHUB_STEP_SUMMARY
            }
          } else {
            "## contract-build diagnostics`n`nShard report was not written; inspect the uploaded runner diagnostics." |
              Add-Content $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload lightweight verification shard report
        if: always() && needs.verification-plan.outputs.execution_mode == 'lightweight-direct'
        uses: actions/upload-artifact@v6
        with:
          name: verification-shard-contract-build
          path: artifacts/verification/shards/contract-build.json
          if-no-files-found: error

      - name: Aggregate direct PR verification
        if: always()
        run: node scripts/verification-ci.mjs aggregate --plan artifacts/verification/ci-plan.json --shards artifacts/verification/shards --output artifacts/verification/latest-pr.json --acceptance-output artifacts/main-acceptance/latest.json

      - name: Upload direct verification report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: direct-verification-report
          path: artifacts/verification/latest-pr.json
          if-no-files-found: warn

      - name: Upload parallel acceptance report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: main-acceptance-diagnostics
          path: artifacts/main-acceptance/latest.json
          if-no-files-found: ignore

  verification-follow-up:
    name: verification follow-up
    needs: [verification-plan, direct-verification]
    if: always() && needs.verification-plan.outputs.execution_mode != 'lightweight-direct'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Download direct verification report
        uses: actions/download-artifact@v7
        with:
          name: direct-verification-report
          path: artifacts/verification
        continue-on-error: true

      - name: Publish follow-up notice
        run: node scripts/verification-follow-up.mjs
