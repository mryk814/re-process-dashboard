name: PR verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  direct-verification:
    name: direct verification
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VERIFY_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22.20.0
          cache: npm

      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.9.15
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Pin npm
        run: npm install --global npm@11.4.2

      - name: Install locked dependencies
        run: |
          npm ci
          uv sync --frozen --extra dev

      - name: Run direct PR verification
        run: npm run verify:pr

      - name: Upload direct verification report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: direct-verification-report
          path: artifacts/verification/latest-pr.json
          if-no-files-found: warn

      - name: Upload main acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: main-acceptance-diagnostics
          path: |
            artifacts/main-acceptance/**/*.json
            artifacts/main-acceptance/**/*.log
          if-no-files-found: ignore

  verification-follow-up:
    name: verification follow-up
    needs: direct-verification
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Download direct verification report
        uses: actions/download-artifact@v7
        with:
          name: direct-verification-report
          path: artifacts/verification
        continue-on-error: true

      - name: Publish follow-up notice
        run: node scripts/verification-follow-up.mjs
