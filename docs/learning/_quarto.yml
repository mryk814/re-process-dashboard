project:
  type: book
  output-dir: _build

profile:
  group:
    - [site, reader]

book:
  title: "Material Decision Workbench 教材"
  subtitle: "型付き契約、データの証拠、identity、migration、lifecycle、復元境界を追う"
  author: "Material Decision Workbench contributors"
  date: last-modified
  search:
    location: sidebar
    type: overlay

bibliography: references.bib
lang: ja
number-depth: 2
toc-depth: 3
filters:
  - filters/exercise-solutions.lua

format:
  html:
    theme:
      - cosmo
      - styles/book.scss
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    search: true
  typst:
    template-partials:
      - typst/typst-show.typ
    page-numbering: false
    papersize: a4
    fontsize: 10.5pt
    margin:
      x: 22mm
      y: 20mm
    toc: true
    section-numbering: "1.1"
