<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Decision ActivityのrequestとresponseがPythonからReactまで進む流れ</title>
  <desc id="desc">React requestからAPI client、FastAPI、Pydantic、application service、handler、保存済みRunを経て、TypeScript unionとReact viewへ戻る。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#476582"/>
    </marker>
    <style>
      .box { fill: #f7fbff; stroke: #476582; stroke-width: 2; rx: 10; }
      .store { fill: #fff8e8; stroke: #9b6a19; stroke-width: 2; rx: 10; }
      .label { font: 600 16px sans-serif; fill: #172b3a; text-anchor: middle; }
      .sub { font: 11.5px sans-serif; fill: #425b6b; text-anchor: middle; }
      .arrow { fill: none; stroke: #476582; stroke-width: 2.5; marker-end: url(#arrow); }
      .phase { font: 700 15px sans-serif; fill: #1d6da5; }
    </style>
  </defs>
  <text class="phase" x="42" y="32">request</text>
  <rect class="box" x="42" y="52" width="190" height="76"/>
  <text class="label" x="137" y="82">React view</text>
  <text class="sub" x="137" y="106">schema versionと候補revision</text>
  <rect class="box" x="286" y="52" width="190" height="76"/>
  <text class="label" x="381" y="82">API client</text>
  <text class="sub" x="381" y="106">生成request型</text>
  <rect class="box" x="530" y="52" width="190" height="76"/>
  <text class="label" x="625" y="82">FastAPI route</text>
  <text class="sub" x="625" y="106">HTTP境界</text>
  <rect class="box" x="774" y="52" width="144" height="76"/>
  <text class="label" x="846" y="82">Pydantic</text>
  <text class="sub" x="846" y="106">unionを選択</text>
  <path class="arrow" d="M232 90 H282"/>
  <path class="arrow" d="M476 90 H526"/>
  <path class="arrow" d="M720 90 H770"/>

  <rect class="box" x="774" y="202" width="144" height="76"/>
  <text class="label" x="846" y="232">Application</text>
  <text class="sub" x="846" y="256">ProjectとCandidateを解決</text>
  <rect class="box" x="530" y="202" width="190" height="76"/>
  <text class="label" x="625" y="232">Activity handler</text>
  <text class="sub" x="625" y="256">差分と寄与を計算</text>
  <rect class="store" x="286" y="202" width="190" height="76"/>
  <text class="label" x="381" y="232">保存済みRun</text>
  <text class="sub" x="381" y="256">provenanceとresult</text>
  <rect class="store" x="42" y="202" width="190" height="76"/>
  <text class="label" x="137" y="232">SQLite</text>
  <text class="sub" x="137" y="256">immutable Run</text>
  <path class="arrow" d="M846 128 V198"/>
  <path class="arrow" d="M774 240 H724"/>
  <path class="arrow" d="M530 240 H480"/>
  <path class="arrow" d="M286 240 H236"/>

  <text class="phase" x="42" y="344">response</text>
  <rect class="box" x="42" y="364" width="190" height="76"/>
  <text class="label" x="137" y="394">FastAPI response</text>
  <text class="sub" x="137" y="418">保存済みRunを返す</text>
  <rect class="box" x="286" y="364" width="190" height="76"/>
  <text class="label" x="381" y="394">TypeScript union</text>
  <text class="sub" x="381" y="418">schema versionで判別</text>
  <rect class="box" x="530" y="364" width="190" height="76"/>
  <text class="label" x="625" y="394">React result view</text>
  <text class="sub" x="625" y="418">差、残差、warning</text>
  <path class="arrow" d="M137 278 V360"/>
  <path class="arrow" d="M232 402 H282"/>
  <path class="arrow" d="M476 402 H526"/>
</svg>
