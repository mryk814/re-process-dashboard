[project]
name = "material-decision-workbench"
version = "0.1.0"
description = "Local material candidate comparison and evidence workbench"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "numpy>=2.0,<3",
  "openpyxl>=3.1,<4",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
pythonpath = ["backend/src"]
testpaths = ["backend/tests"]
addopts = "-q"
