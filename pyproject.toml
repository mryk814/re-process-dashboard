[project]
name = "material-decision-workbench"
version = "0.1.0"
description = "Local candidate comparison and decision evidence workbench"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "lightgbm>=4.6,<5",
  "numpy>=2.0,<3",
  "openpyxl>=3.1,<4",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "scipy>=1.14,<2",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pyinstaller>=6.14,<7",
  "pytest>=8.4,<9",
  "pytest-xdist>=3.8,<4",
]
runtime-sklearn = [
  "scikit-learn>=1.6,<2",
  "skops>=0.11,<1",
]
runtime-lightgbm = []
runtime-gpytorch = [
  "torch>=2.6,<3",
  "gpytorch>=1.14,<2",
  "safetensors>=0.5,<1",
]
runtime-numpyro = [
  "jax>=0.5,<1",
  "jaxlib>=0.5,<1",
  "numpyro>=0.17,<1",
]
model-package-signing = [
  "cryptography>=44,<46",
]
shared = [
  "minio>=7.2,<8",
  "psycopg[binary]>=3.2,<4",
]

[tool.pytest.ini_options]
pythonpath = ["backend/src"]
testpaths = ["backend/tests"]
addopts = "-q -n 4 --dist loadfile"
